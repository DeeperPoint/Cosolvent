[project]
name = "cosolvent"
version = "0.1.0"
description = "Configurable marketplace platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DeeperPoint Contributors" }]
requires-python = ">=3.11"
keywords = ["marketplace", "thin-markets", "fastapi", "postgres", "pgvector", "arq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "arq>=0.26.0",
    "pyyaml>=6.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "openai>=1.50.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "cohere>=5.10.0",
    "questionary>=2.0.0",
    "rich>=13.9.0",
    "resend>=2.4.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/DeeperPoint/cosolvent-beta"
Repository = "https://github.com/DeeperPoint/cosolvent-beta"
Issues = "https://github.com/DeeperPoint/cosolvent-beta/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests against running infrastructure",
    "e2e: end-to-end tests against full stack",
    "live: tests requiring live external providers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
