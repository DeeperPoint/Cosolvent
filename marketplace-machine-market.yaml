discovery:
  searchable_types:
  - machine_shop
  - quality_inspector
  - rigging_logistics_provider
  - cargo_insurer
  - trade_finance_provider
  - certification_body
  filter_fields:
  - country
  - machine_type
  - tool_taper
  - deal_instrument
  - material_grade
  - material_family
  - required_processes
  - end_use_sector
  result_visibility:
    anonymous: public
    authenticated: protected
  ai:
    vector_search_enabled: true
    rag_query_enabled: true
    follow_up_suggestions: true
    profile_retrieval_mode: hybrid
    rag_failure_behavior: empty
    profile_similarity_threshold: 0.25
    max_vector_candidates: 500
  access:
    anonymous_search_enabled: true
    anonymous_filter_mode: public_only
  matching:
