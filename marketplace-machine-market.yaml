profile_schemas:
  machine_shop:
    sections:
    - name: Company
      fields:
      - name: company_name
        label: Company Name
        type: text
        required: true
        visibility: public
        searchable: true
      - name: country
        label: Country
        type: select
        required: true
        options:
        - usa
        - canada
        - mexico
        - germany
        - brazil
        - india
        - china
        - japan
        visibility: public
        searchable: true
      - name: description
        label: About
        type: rich_text
        required: false
        visibility: public
        searchable: true
    - name: Offering
      fields:
      - name: machine_type
        label: Machine Type
        type: multi_select
        required: true
        options:
        - vertical_machining_center
        - cnc_lathe
        - 3_axis_mill
        - 4_axis_mill
        - 5_axis_machining_center
        - multiaxis_machining_center
        - laser_cutting
        - waterjet_cutting
        visibility: public
        searchable: true
      - name: tool_taper
        label: Tool Taper
        type: multi_select
        required: false
        options:
        - ct40
        - bt40
        - big_plus_no_40
        - big_plus_no_50
        visibility: public
        searchable: true
      - name: max_spindle_speed_rpm
        label: Max Spindle Speed (RPM)
        type: number
        required: false
        visibility: public
        searchable: true
      - name: table_load_limit_kg
        label: Table Load Limit (kg)
        type: number
        required: false
        visibility: public
        searchable: true
      - name: deal_instrument
        label: Deal Instrument
        type: multi_select
        required: true
        options:
        - spot_purchase
        - capacity_rental
        - ongoing_subcontract
        visibility: protected
        searchable: true
      - name: material_grade
        label: Material Grade
        type: multi_select
        required: true
        options:
        - aluminum_7075_t6
        - aluminum_6061
        - ti_6al_4v
        - inconel_625
        - inconel_718
        - stainless_steel
        - carbon_steel
        - plastic
        visibility: public
        searchable: true
      - name: material_family
        label: Material Family
        type: multi_select
        required: false
        options:
        - aluminum_alloy
        - titanium_alloy
        - nickel_superalloy
        - steel
        - non_ferrous
        - polymer
        visibility: public
        searchable: true
      - name: required_processes
        label: Required Processes
        type: multi_select
        required: false
        options:
        - heat_treatment
        - coating
        - edm
        - threadmilling
        - inspection_cmm
        - deburring
        visibility: public
        searchable: true
      - name: end_use_sector
        label: End Use Sector
        type: multi_select
        required: false
        options:
        - aerospace
        - defense
        - automotive
        - medical
        - power_generation
        - marine
        - general_industrial
        visibility: public
        searchable: true
      - name: quality_certification
        label: Quality Certification
        type: multi_select
        required: true
        options:
        - iso_9001
        - as9100d
        - as9110
        - as9120
