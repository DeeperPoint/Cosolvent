name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app cli tests scripts
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Generated artifacts in sync
        run: python -m cli compile --check --config marketplace.yaml --mode mvp

  integration-and-local-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify suites are not placeholders
        run: python scripts/check_test_suites.py
      - name: Start stack
        env:
          API_HOST_PORT: "18000"
        run: docker compose up -d --build
      - name: Wait for API health
        run: python scripts/wait_for_http.py --url http://localhost:18000/api/health --timeout 180
      - name: Generated role alias route smoke
        run: |
          python - <<'PY'
          import json, urllib.request
          data = json.loads(urllib.request.urlopen("http://localhost:18000/openapi.json").read().decode("utf-8"))
          paths = data.get("paths", {})
          assert any(path.startswith("/api/roles/") for path in paths), "no generated /api/roles/* paths found"
          print("generated alias route smoke ok")
          PY
      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
          INTEGRATION_BASE_URL: "http://localhost:18000"
        run: pytest tests/integration -q
      - name: Local full-stack E2E
        env:
          RUN_E2E: "1"
          E2E_BASE_URL: "http://localhost:18000"
        run: pytest tests/e2e/test_local_full_stack.py -q
      - name: Coverage gate (unit + integration modules)
        env:
          RUN_INTEGRATION: "1"
          INTEGRATION_BASE_URL: "http://localhost:18000"
        run: |
          pytest tests/unit tests/integration \
            --cov=app.core \
            --cov=app.engine \
            --cov=cli \
            --cov-report=term-missing \
            --cov-fail-under=80 -q
      - name: Shutdown stack
        if: always()
        run: docker compose down -v

  live-provider-e2e:
    runs-on: ubuntu-latest
    needs: integration-and-local-e2e
    if: ${{ secrets.OPENAI_API_KEY != '' && secrets.RESEND_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start stack with provider secrets
        env:
          API_HOST_PORT: "18000"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: docker compose up -d --build
      - name: Wait for API health
        run: python scripts/wait_for_http.py --url http://localhost:18000/api/health --timeout 180
      - name: Run live-provider E2E
        env:
          RUN_LIVE_E2E: "1"
          E2E_BASE_URL: "http://localhost:18000"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: pytest tests/e2e/test_live_providers.py -q -rs
      - name: Shutdown stack
        if: always()
        run: docker compose down -v

  live-provider-e2e-skipped:
    runs-on: ubuntu-latest
    needs: integration-and-local-e2e
    if: ${{ !(secrets.OPENAI_API_KEY != '' && secrets.RESEND_API_KEY != '') }}
    steps:
      - name: Explain live-provider skip
        run: echo "Live-provider E2E skipped: one or more required secrets are not configured."
