services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cosolvent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cosolvent"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.setup_app:app --host 0.0.0.0 --port 8080
    environment:
      MARKETPLACE_CONFIG_PATH: /project/marketplace.yaml
    volumes:
      - ./:/project
    working_dir: /project/backend
    ports:
      - "${SETUP_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  createbuckets:
    image: minio/mc
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set locals3 http://s3:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing locals3/cosolvent-files;
      /usr/bin/mc anonymous set public locals3/cosolvent-files;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - type: bind
        source: ./
        target: /project
        read_only: false
    working_dir: /project/backend
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/cosolvent
      REDIS_URL: redis://redis:6379
      MARKETPLACE_CONFIG_PATH: /project/marketplace.yaml
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-}
      ALLOW_PUBLIC_APPLICATION: ${ALLOW_PUBLIC_APPLICATION:-}
      SESSION_SECRET: test-secret
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-live}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      S3_BUCKET: ${S3_BUCKET:-cosolvent-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: arq app.workers.settings.WorkerSettings
    volumes:
      - type: bind
        source: ./
        target: /project
        read_only: true
    working_dir: /project/backend
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/cosolvent
      REDIS_URL: redis://redis:6379
      MARKETPLACE_CONFIG_PATH: /project/marketplace.yaml
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-}
      ALLOW_PUBLIC_APPLICATION: ${ALLOW_PUBLIC_APPLICATION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      S3_BUCKET: ${S3_BUCKET:-cosolvent-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
