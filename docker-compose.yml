services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cosolvent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cosolvent"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/cosolvent
      REDIS_URL: redis://redis:6379
      MARKETPLACE_CONFIG_PATH: /app/marketplace.example.yaml
      SESSION_SECRET: test-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      S3_BUCKET: ${S3_BUCKET:-cosolvent-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: .
    command: arq app.workers.settings.WorkerSettings
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres:5432/cosolvent
      REDIS_URL: redis://redis:6379
      MARKETPLACE_CONFIG_PATH: /app/marketplace.example.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      S3_BUCKET: ${S3_BUCKET:-cosolvent-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
