marketplace:
  name: MachineMarket
  description: A thin-market marketplace for Machinery Trade.
  industry: Industrial Machinery
participant_types:
- name: Seller
  slug: seller
  role: supply
  permissions:
    can_list: true
    can_search: false
    can_initiate_conversation: false
    can_receive_conversation: true
    can_share_private_assets: true
    requires_onboarding: true
    requires_approval: true
    visible_in_search: true
- name: Buyer
  slug: buyer
  role: demand
  permissions:
    can_list: false
    can_search: true
    can_initiate_conversation: true
    can_receive_conversation: true
    can_share_private_assets: false
    requires_onboarding: true
    requires_approval: true
    visible_in_search: false
- name: Service Provider
  slug: service_provider
  role: facilitator
  permissions:
    can_list: true
    can_search: false
    can_initiate_conversation: false
    can_receive_conversation: true
    can_share_private_assets: true
    requires_onboarding: true
    requires_approval: true
    visible_in_search: true
profile_schemas:
  seller:
    sections:
    - name: Company
      fields:
      - name: company_name
        label: Company Name
        type: text
        required: true
        visibility: public
        searchable: true
      - name: country
        label: Country
        type: select
        required: true
        options:
        - USA
        - Canada
        - Mexico
        - Germany
        - Italy
        - Japan
        - China
        - South Korea
        - India
        - Brazil
        visibility: public
        searchable: true
      - name: description
        label: About
        type: rich_text
        required: false
        visibility: public
        searchable: true
    - name: Offering
      fields:
      - name: machinery_category
        label: Machinery Category
        type: multi_select
        required: true
        options:
        - Construction
        - Agriculture
        - Manufacturing / CNC
        - Material Handling
        - Mining
        - Power Generation
        - Forestry
        - Oil & Gas
        visibility: public
        searchable: true
      - name: brand
        label: Brand
        type: multi_select
        required: false
        options:
        - Caterpillar
        - Komatsu
        - John Deere
        - Volvo
        - Hitachi
        - JCB
        - Liebherr
        - Doosan
        - Mitsubishi
        - Other
        visibility: public
        searchable: true
      - name: condition
        label: Condition
        type: multi_select
        required: true
        options:
        - New
        - Used
        - Refurbished
        - Parts Only
        visibility: public
        searchable: true
      - name: certifications
        label: Certifications
        type: multi_select
        required: false
        options:
        - ISO 9001
        - CE Marking
        - OSHA Compliant
        - EPA Tier 4
        visibility: public
        searchable: true
      - name: average_unit_price_usd
        label: Average Unit Price Usd
        type: number
        required: false
        visibility: public
        searchable: true
      - name: spec_sheets
        label: Spec Sheets / Documents
        type: files
        required: false
        accepted_types:
        - pdf
        visibility: private
        searchable: false
  buyer:
    sections:
    - name: Organization
      fields:
      - name: company_name
        label: Organization Name
        type: text
        required: true
        visibility: public
        searchable: true
      - name: country
        label: Country
        type: select
        required: true
        options:
        - USA
        - Canada
        - Mexico
        - Germany
        - Italy
        - Japan
        - China
        - South Korea
        - India
        - Brazil
        visibility: public
        searchable: true
      - name: description
        label: About
        type: rich_text
        required: false
        visibility: public
        searchable: true
    - name: Requirements
      fields:
      - name: machinery_category
        label: Machinery Category
        type: multi_select
        required: true
        options:
        - Construction
        - Agriculture
        - Manufacturing / CNC
        - Material Handling
        - Mining
        - Power Generation
        - Forestry
        - Oil & Gas
        visibility: protected
        searchable: true
      - name: brand
        label: Brand
        type: multi_select
        required: false
        options:
        - Caterpillar
        - Komatsu
        - John Deere
        - Volvo
        - Hitachi
        - JCB
        - Liebherr
        - Doosan
        - Mitsubishi
        - Other
        visibility: protected
        searchable: true
      - name: condition
        label: Condition
        type: multi_select
        required: true
        options:
        - New
        - Used
        - Refurbished
        - Parts Only
        visibility: protected
        searchable: true
      - name: certifications
        label: Certifications
        type: multi_select
        required: false
        options:
        - ISO 9001
        - CE Marking
        - OSHA Compliant
        - EPA Tier 4
        visibility: protected
        searchable: true
      - name: average_unit_price_usd
        label: Average Unit Price Usd
        type: number
        required: false
        visibility: protected
        searchable: true
      - name: budget_range
        label: Typical Budget per Order
        type: select
        required: false
        options:
        - Under 25k
        - 25k-100k
        - 100k-500k
        - 500k-2M
        - 2M+
        visibility: protected
        searchable: false
  service_provider:
    sections:
    - name: Company
      fields:
      - name: company_name
        label: Company Name
        type: text
        required: true
        visibility: public
        searchable: true
      - name: country
        label: Country
        type: select
        required: true
        options:
        - USA
        - Canada
        - Mexico
        - Germany
        - Italy
        - Japan
        - China
        - South Korea
        - India
        - Brazil
        visibility: public
        searchable: true
      - name: description
        label: About
        type: rich_text
        required: false
        visibility: public
        searchable: true
    - name: Services
      fields:
      - name: services_offered
        label: Services Offered
        type: multi_select
        required: true
        options:
        - Transport Carrier
        - Rigging Specialist
        - Machinery Inspector
        - Customs Broker
        - Cargo Insurer
        visibility: public
        searchable: true
      - name: service_regions
        label: Service Regions
        type: multi_select
        required: true
        options:
        - North America
        - South America
        - Europe
        - Middle East
        - Africa
        - South Asia
        - East Asia
        - Southeast Asia
        - Oceania
        visibility: public
        searchable: true
      - name: equipment_types
        label: Equipment Types
        type: multi_select
        required: true
        options:
        - Flatbed
        - Step Deck
        - Double Drop / Lowboy
        - Removable Gooseneck (RGN)
        - Container
        - Roll-On/Roll-Off
        - Heavy Haul Specialized
        visibility: public
        searchable: true
      - name: carrier_certifications
        label: Carrier Certifications
        type: multi_select
        required: false
        options:
        - DOT Compliant
        - ADR (EU)
        - TIR Carnet
        - ISO 9001
        - C-TPAT
        visibility: public
        searchable: true
      - name: credentials
        label: Credentials / Certificates
        type: files
        required: false
        accepted_types:
        - pdf
        visibility: private
        searchable: false
onboarding:
  seller:
    requires_approval: true
    approval_type: manual
    document_upload_required: true
    ai_extraction_enabled: true
    ai_profile_generation: true
    welcome_email_on_approval: true
    profile_completeness_threshold: 80
  buyer:
    requires_approval: true
    approval_type: manual
    document_upload_required: false
    ai_extraction_enabled: false
    ai_profile_generation: false
    welcome_email_on_approval: true
    profile_completeness_threshold: 70
  service_provider:
    requires_approval: true
    approval_type: manual
    document_upload_required: true
    ai_extraction_enabled: true
    ai_profile_generation: true
    welcome_email_on_approval: true
    profile_completeness_threshold: 80
communication:
  conversation_rules:
  - initiator: buyer
    receiver: seller
    requires_approval: true
  - initiator: buyer
    receiver: service_provider
    requires_approval: true
discovery:
  searchable_types:
  - seller
  - service_provider
  filter_fields:
  - country
  - machinery_category
  - brand
  - condition
  - certifications
  - services_offered
  - service_regions
  - equipment_types
  result_visibility:
    anonymous: public
    authenticated: protected
  ai:
    vector_search_enabled: true
    rag_query_enabled: true
    follow_up_suggestions: true
    profile_retrieval_mode: hybrid
    rag_failure_behavior: empty
    profile_similarity_threshold: 0.25
    max_vector_candidates: 500
  access:
    anonymous_search_enabled: true
    anonymous_filter_mode: public_only
ai:
  enabled_providers:
  - openai
auth:
  allow_public_signup: false
  allow_public_application: true
