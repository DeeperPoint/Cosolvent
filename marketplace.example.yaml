marketplace:
  name: "GrainPlaza"
  description: "Connecting specialty grain producers with global buyers"
  industry: "Specialty Agriculture"

auth:
  allow_public_signup: false

participant_types:
  - name: "Producer"
    slug: "producer"
    role: "supply"
    permissions:
      can_list: true
      can_search: false
      can_initiate_conversation: false
      can_receive_conversation: true
      can_share_private_assets: true
      requires_onboarding: true
      requires_approval: true
      visible_in_search: true

  - name: "Buyer"
    slug: "buyer"
    role: "demand"
    permissions:
      can_list: false
      can_search: true
      can_initiate_conversation: true
      can_receive_conversation: true
      can_share_private_assets: false
      requires_onboarding: true
      requires_approval: false
      visible_in_search: false

profile_schemas:
  producer:
    sections:
      - name: "Basic Information"
        fields:
          - { name: farm_name, label: "Farm Name", type: text, required: true, visibility: public, searchable: true }
          - { name: country, label: "Country", type: select, required: true, options: ["Canada", "USA", "Brazil", "Australia", "Argentina"], visibility: public, searchable: true }
          - { name: region, label: "Region/Province", type: text, required: false, visibility: public, searchable: true }
          - { name: primary_crops, label: "Primary Crops", type: multi_select, required: true, options: ["Wheat", "Barley", "Canola", "Oats", "Lentils", "Peas", "Flax"], visibility: public, searchable: true }
          - { name: description, label: "Description", type: rich_text, required: false, visibility: public, searchable: true }
      - name: "Production Details"
        fields:
          - { name: annual_production, label: "Annual Production (MT)", type: number, required: false, visibility: protected, searchable: true }
          - { name: certifications, label: "Certifications", type: multi_select, required: false, options: ["Organic", "Non-GMO", "Fair Trade", "ISO 22000"], visibility: public, searchable: true }
          - { name: protein_content, label: "Protein Content Range (%)", type: text, required: false, visibility: protected, searchable: true }
          - { name: storage_capacity, label: "Storage Capacity (MT)", type: number, required: false, visibility: protected, searchable: false }
      - name: "Internal"
        fields:
          - { name: financial_notes, label: "Financial Notes", type: text, required: false, visibility: private, searchable: false }

  buyer:
    sections:
      - name: "Organization"
        fields:
          - { name: org_name, label: "Organization Name", type: text, required: true, visibility: public, searchable: true }
          - { name: country, label: "Country", type: select, required: true, options: ["Canada", "USA", "Brazil", "Japan", "South Korea", "Germany", "Italy"], visibility: public, searchable: true }
          - { name: business_type, label: "Business Type", type: select, required: true, options: ["Mill", "Brewery", "Bakery", "Trading Company", "Food Manufacturer", "Other"], visibility: public, searchable: true }
          - { name: description, label: "Description", type: rich_text, required: false, visibility: public, searchable: true }
      - name: "Sourcing Needs"
        fields:
          - { name: crops_of_interest, label: "Crops of Interest", type: multi_select, required: false, options: ["Wheat", "Barley", "Canola", "Oats", "Lentils", "Peas", "Flax"], visibility: protected, searchable: false }
          - { name: annual_volume_needed, label: "Annual Volume Needed (MT)", type: number, required: false, visibility: protected, searchable: false }

onboarding:
  producer:
    requires_approval: true
    approval_type: "manual"
    document_upload_required: true
    ai_extraction_enabled: true
    ai_profile_generation: true
    welcome_email_on_approval: true
    profile_completeness_threshold: 80

  buyer:
    requires_approval: false
    approval_type: "auto"
    document_upload_required: false
    ai_extraction_enabled: false
    ai_profile_generation: false
    welcome_email_on_approval: true
    profile_completeness_threshold: 100

communication:
  conversation_rules:
    - { initiator: buyer, receiver: producer, requires_approval: true }

discovery:
  searchable_types: ["producer"]
  filter_fields: ["country", "primary_crops", "certifications"]
  result_visibility:
    anonymous: "public"
    authenticated: "protected"
  access:
    anonymous_search_enabled: false
    anonymous_filter_mode: "public_only"
  ai:
    vector_search_enabled: true
    rag_query_enabled: true
    follow_up_suggestions: true
    profile_retrieval_mode: "rag_strict"
    rag_failure_behavior: "service_unavailable"
    profile_similarity_threshold: 0.25
    max_vector_candidates: 500
