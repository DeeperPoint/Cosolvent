[project]
name = "cosolvent-frontend-compiler"
version = "1.0.0"
description = "YAML-driven frontend compiler — generates a Next.js app from OpenAPI + marketplace.yaml"
readme = "../../README.md"
license = { text = "MIT" }
authors = [{ name = "DeeperPoint Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compiler"]

[tool.pytest.ini_options]
testpaths = ["compiler/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
